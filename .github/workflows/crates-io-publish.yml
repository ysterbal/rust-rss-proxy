name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "publish" to confirm crates.io publication'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # This environment requires approval from authorized maintainers
    environment: crates-io-publish
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify confirm input for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirm_publish }}" != "publish" ]]; then
            echo "Confirmation input must be 'publish' to proceed."
            exit 1
          fi

      - name: Verify version tag matches Cargo.toml
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n 1 | awk '{print $3}' | tr -d '"')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Version in Cargo.toml ($VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Check if package is already published
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n 1 | awk '{print $3}' | tr -d '"')
          if cargo search rss-proxy --limit 1 | grep -q "^rss-proxy = \"$VERSION\""; then
            echo "Version $VERSION is already published to crates.io"
            exit 1
          fi
          echo "Version $VERSION is ready to be published"

      - name: Publish to crates.io
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --token ${CRATES_IO_TOKEN}
