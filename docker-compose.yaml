version: '3.8'

services:
  rss-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss-proxy
    ports:
      - "${RSS_PROXY_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./plugins:/app/plugins:ro
    environment:
      - RUST_LOG=rss_proxy=info,tower_http=debug
    restart: unless-stopped
